name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_ADMIN_URL: http://localhost:3001

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Run repository safety scans
        shell: bash
        run: |
          set -euo pipefail

          if git grep -I -q $'\u2014' -- apps; then
            echo "User-facing application files contain an em dash."
            exit 1
          fi

          secret_pattern='(sb_secret_[A-Za-z0-9_-]{20,}|re_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{20,})'
          if git grep -I -q -E "$secret_pattern" -- .; then
            echo "A tracked file matches a high-confidence secret pattern."
            exit 1
          fi

          for variable in \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_DB_PASSWORD \
            SUPABASE_SECRET_KEY \
            SUPABASE_SERVICE_ROLE_KEY \
            RESEND_API_KEY; do
            if printenv "$variable" >/dev/null 2>&1; then
              echo "$variable must not be injected into the credential-free validation job."
              exit 1
            fi
          done

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck --force

      - name: Test
        run: pnpm test --force

      - name: Build public web app
        run: pnpm --filter @aiyomi/web build

      - name: Build admin app
        run: pnpm --filter @aiyomi/admin build

      - name: Validate Expo configuration
        run: pnpm --filter @aiyomi/mobile exec expo config --type public
